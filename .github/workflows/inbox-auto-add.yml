name: Auto-add to Pulse Inbox

# DISABLED 2026-05-13: runs-on: self-hosted but no self-hosted runner is
# currently provisioned. Every fire showed as "queued forever / cancelled"
# in PR check status, polluting the dashboard. Auto-triggers removed;
# workflow_dispatch retained so it can be re-enabled by anyone bringing
# back a runner (or re-targeting to ubuntu-latest + porting maw to a
# GitHub-hosted runner).
#
# Original triggers (kept here for revival):
#   issues:
#     types: [opened, closed]
#   pull_request:
#     types: [opened, closed]

on:
  workflow_dispatch:

jobs:
  add-to-inbox:
    if: >-
      (github.event_name == 'issues' && github.event.action == 'opened') ||
      (github.event_name == 'pull_request' && github.event.action == 'opened')
    runs-on: self-hosted
    steps:
      - name: Add to Pulse Inbox Board
        env:
          GH_TOKEN: ${{ secrets.PULSE_TOKEN }}
          EVENT_URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
          EVENT_TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
        run: |
          export PATH="/usr/bin:/usr/local/bin:/opt/homebrew/bin:$PATH"
          URL="$EVENT_URL"
          TITLE="$EVENT_TITLE"
          gh project item-add 8 --owner laris-co --url "$URL" || true
          echo "Added $TITLE to Pulse Inbox"

  notify-issue-closed:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'closed'
    runs-on: self-hosted
    steps:
      - name: Notify Pulse of closed issue
        env:
          REPO_NAME: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          export PATH="/usr/bin:/usr/local/bin:/opt/homebrew/bin:$PATH"
          REPO="$REPO_NAME"
          NUM="#$ISSUE_NUMBER"
          TITLE="$ISSUE_TITLE"
          URL="$ISSUE_URL"
          maw hey pulse-oracle "Issue closed: ${REPO} ${NUM} — ${TITLE} ${URL} — GitHub Actions" || true
          echo "Notified Pulse: ${REPO} ${NUM} closed"

  notify-pr-merged:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: self-hosted
    steps:
      - name: Notify Pulse of merged PR
        env:
          GH_TOKEN: ${{ secrets.PULSE_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          export PATH="/usr/bin:/usr/local/bin:/opt/homebrew/bin:$PATH"
          REPO="$REPO_NAME"
          PR="#$PR_NUMBER"
          TITLE="$PR_TITLE"
          AUTHOR="$PR_AUTHOR"
          BRANCH="$PR_BRANCH"
          URL="$PR_URL"

          BODY="### PR Merged
          - **Repo**: ${REPO}
          - **PR**: [${PR} ${TITLE}](${URL})
          - **Author**: ${AUTHOR}
          - **Branch**: ${BRANCH}"

          # Post to Pulse monitoring Discussion #50
          gh api graphql \
            -f query='mutation($id: ID!, $body: String!) { addDiscussionComment(input: {discussionId: $id, body: $body}) { comment { url } } }' \
            -f id="D_kwDORFUDA84Akwe8" \
            -f body="${BODY}" || true

          # maw hey Pulse
          maw hey pulse-oracle "PR merged: ${REPO} ${PR} — ${TITLE} (by ${AUTHOR}) ${URL} — GitHub Actions" || true
          echo "Notified Pulse: ${REPO} ${PR} merged"
